
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip IRLLevelUp_Android_Project.zip
          cd IRLLevelUp
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRLLevelUp-debug-apk
          path: IRLLevelUp/app/build/outputs/apk/debug/app-debug.apk
